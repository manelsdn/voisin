name: Supabase actif

on:
  schedule:
    - cron: "17 6 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Requête vers la base Supabase
        env:
          SUPABASE_URL: https://mpojrohskpyntqogkfen.supabase.co
          SUPABASE_KEY: sb_publishable_06PtR7kH-tiE84Ku1YolXQ_SM1qkMtA
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "$SUPABASE_URL/rest/v1/users?select=id&limit=1" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY")
          echo "Réponse Supabase : $code"
          test "$code" = "200"
